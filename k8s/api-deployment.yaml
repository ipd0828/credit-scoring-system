apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-api
  namespace: credit-scoring
  labels:
    app: credit-scoring-api
    component: api
spec:
  replicas: 1  # Один для начала
  selector:
    matchLabels:
      app: credit-scoring-api
  template:
    metadata:
      labels:
        app: credit-scoring-api
        component: api
    spec:
      containers:
      - name: api
        image: credit-scoring-api:test  # Наш собранный образ
        imagePullPolicy: Never  # Используем локальный образ
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: credit-scoring-config
              key: MODEL_PATH
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-api
  namespace: credit-scoring
spec:
  selector:
    app: credit-scoring-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP