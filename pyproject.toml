[tool.black]
line-length = 88
target-version = ["py312"]
# Исключаем из форматирования окружения, кэши и сгенерированные артефакты
extend-exclude = '''
/(
    \.git
  | \.github
  | \.venv
  | venv
  | env
  | \.env
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | \.coverage
  | htmlcov
  | dist
  | build
  | \.tox
  | \.nox
  | \.streamlit
  | mlruns
  | models
  | monitoring/reports
  | DATA_OUT
  | data
  | catboost_info
  | scripts/data_processing/data
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "dist",
    "build",
    "mlruns",
    "models",
    "DATA_OUT",
    "data",
    "catboost_info",
    "scripts/data_processing/data",
]
